name: ci

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "k8s/kustomization.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/kustomization.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/sde-w

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'packages/shared/**'
            booking:
              - 'backend/**'
            booking-expiry-worker:
              - 'packages/booking-expiry-worker/**'
            campaign-worker:
              - 'packages/campaign-worker/**'
            audit-worker:
              - 'packages/audit-worker/**'
            seller-notification-worker:
              - 'packages/seller-notification-worker/**'
            csv-room-import-worker:
              - 'packages/csv-room-import-worker/**'
            availability-worker:
              - 'packages/availability-worker/**'
            property-search-worker:
              - 'packages/property-search-worker/**'

      - name: Set build matrix
        id: set
        shell: bash
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          BOOKING: ${{ steps.filter.outputs.booking }}
          BOOKING_EXPIRY_WORKER: ${{ steps.filter.outputs.booking-expiry-worker }}
          CAMPAIGN_WORKER: ${{ steps.filter.outputs.campaign-worker }}
          AUDIT_WORKER: ${{ steps.filter.outputs.audit-worker }}
          SELLER_NOTIFICATION_WORKER: ${{ steps.filter.outputs.seller-notification-worker }}
          CSV_ROOM_IMPORT_WORKER: ${{ steps.filter.outputs.csv-room-import-worker }}
          AVAILABILITY_WORKER: ${{ steps.filter.outputs.availability-worker }}
          PROPERTY_SEARCH_WORKER: ${{ steps.filter.outputs.property-search-worker }}
        run: |
          python - <<'PY'
          import json
          import os
          services = []
          if os.environ['SHARED'] == 'true':
              services = [
                  'booking',
                  'booking-expiry-worker',
                  'campaign-worker',
                  'audit-worker',
                  'seller-notification-worker',
                  'csv-room-import-worker',
                  'availability-worker',
                  'property-search-worker',
              ]
          else:
              for svc, flag in [
                  ('booking', os.environ['BOOKING']),
                  ('booking-expiry-worker', os.environ['BOOKING_EXPIRY_WORKER']),
                  ('campaign-worker', os.environ['CAMPAIGN_WORKER']),
                  ('audit-worker', os.environ['AUDIT_WORKER']),
                  ('seller-notification-worker', os.environ['SELLER_NOTIFICATION_WORKER']),
                  ('csv-room-import-worker', os.environ['CSV_ROOM_IMPORT_WORKER']),
                  ('availability-worker', os.environ['AVAILABILITY_WORKER']),
                  ('property-search-worker', os.environ['PROPERTY_SEARCH_WORKER']),
              ]:
                  if flag == 'true':
                      services.append(svc)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"services={json.dumps(services)}\\n")
          PY

  build:
    name: Build and push ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dockerfile path
        id: dockerfile
        shell: bash
        run: |
          if [[ "${{ matrix.service }}" == "booking" ]]; then
            echo "path=backend/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=packages/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/itachi-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/itachi-${{ matrix.service }}:latest

  update-kustomization:
    name: Open PR for kustomization updates
    needs:
      - changes
      - build
    if: needs.changes.outputs.services != '[]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SERVICES: ${{ needs.changes.outputs.services }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update image references
        shell: bash
        run: |
          cd k8s
          python - <<'PY'
          import json
          import os
          import subprocess
          services = json.loads(os.environ['SERVICES'])
          for svc in services:
              subprocess.run([
                  'kustomize', 'edit', 'set', 'image',
                  f'ghcr.io/sde-w/itachi-{svc}=ghcr.io/sde-w/itachi-{svc}:{os.environ["SHA"]}'
              ], check=True)
          PY

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/image-tag-bump-${{ github.run_id }}
          base: main
          title: "ci: update kustomize image tags"
          body: |
            This PR updates the kustomization image tags for the services built by CI.
          commit-message: "ci: update kustomize image tags"
          delete-branch: true
