networks:
  app-tier:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    networks:
      - app-tier
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file:
      - ./.env.production
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7.0-alpine
    container_name: redis
    env_file:
      - ./.env.production
    networks:
      - app-tier
    command: redis-server /etc/redis/redis.conf --save ""
    volumes:
      - redis-data:/data
      - ./_infra/redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    networks:
      - app-tier
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/booking_platform
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
            
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - app-tier
    env_file:
      - ./.env.production
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.primary.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  postgres-replica:
      image: postgres:16-alpine
      container_name: postgres-replica
      networks:
        - app-tier
      env_file:
        - ./.env.production
      environment:
        PGUSER: replicator
        PGPASSWORD: ${REPLICATOR_PASSWORD}
      volumes:
        - postgres_replica_data:/var/lib/postgresql/data
      depends_on:
        postgres:
          condition: service_healthy
      entrypoint: >
        bash -c "
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Taking base backup from primary...';
          gosu postgres pg_basebackup -h postgres -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        fi;
        exec docker-entrypoint.sh postgres"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U replicator"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 45s
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - app-tier
    volumes:
      - redis-insight-data:/db
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    networks:
      - app-tier
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m

  booking:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: booking
    env_file:
      - ./.env.production
    networks:
      - app-tier
    ports:
      - "4000:4000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:   
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  redis-data:
  rabbitmq_data:
  postgres_data:
  es-data:
  redis-insight-data:
  postgres_replica_data:


  