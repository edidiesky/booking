networks:
  app-tier:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    networks:
      - app-tier
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file:
      - ./.env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m30s

  redis:
    image: redis:7.0-alpine
    container_name: redis
    env_file:
      - ./.env.production
    networks:
      - app-tier
    command: redis-server /etc/redis/redis.conf --save ""
    volumes:
      - redis-data:/data
      - ./_infra/redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  db-roles:
    image: postgres:16-alpine
    networks: [app-tier]
    env_file: [./.env.production]
    volumes:
      - ./postgres/bootstrap-roles.sh:/bootstrap-roles.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-roles.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    env_file:
      - ./.env.production
    networks:
      - app-tier
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '"pgbouncer" "%s"\n' "$$PGBOUNCER_AUTH_PASSWORD" > /tmp/userlist.txt
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
            
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - app-tier
    env_file:
      - ./.env.production
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-monitoring.sh:/docker-entrypoint-initdb.d/20-monitoring.sh:ro
      - ./postgres/postgresql.primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.primary.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  postgres-replica:
      image: postgres:16-alpine
      container_name: postgres-replica
      networks:
        - app-tier
      env_file:
        - ./.env.production
      environment:
        PGUSER: replicator
        PGPASSWORD: ${REPLICATOR_PASSWORD}
      volumes:
        - postgres_replica_data:/var/lib/postgresql/data
      depends_on:
        postgres:
          condition: service_healthy
      entrypoint: >
        bash -c "
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Taking base backup from primary...';
          gosu postgres pg_basebackup -h postgres -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R;
        fi;
        exec docker-entrypoint.sh postgres"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U replicator"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 45s
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - app-tier
    volumes:
      - redis-insight-data:/db
    restart: unless-stopped

  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
  #   container_name: elasticsearch
  #   networks:
  #     - app-tier
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "127.0.0.1:9200:9200"
  #   volumes:
  #     - es-data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 1m

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    env_file:
      - ./.env.production
    networks:
      - app-tier
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      booking:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 30s
  booking:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: booking
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL:           postgres://booking_app:${APP_DB_PASSWORD}@pgbouncer:6432/booking_platform
      WORKER_DATABASE_URL:    postgres://booking_worker:${WORKER_DB_PASSWORD}@pgbouncer:6432/booking_platform
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/booking_platform
      ADMIN_DATABASE_URL:     postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/booking_platform
      RABBITMQ_URL: ${RABBITMQ_URL}
    networks:
      - app-tier
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      
      postgres:
        condition: service_healthy
      pgbouncer:   
        condition: service_healthy
      db-roles: 
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
  booking-service:
    build:
      context: ..
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    env_file:
      - ./.env.production
    environment:
      PORT: "4101"
      DATABASE_URL: postgres://booking_app:${APP_DB_PASSWORD}@pgbouncer:6432/booking_platform
      RABBITMQ_URL: ${RABBITMQ_URL}
      SERVICE_NAME: booking-service
    networks:
      - app-tier
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4101/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    env_file:
      - ./.env.production
    environment:
      PORT: "4102"
      DATABASE_URL: postgres://booking_app:${APP_DB_PASSWORD}@pgbouncer:6432/booking_platform
      RABBITMQ_URL: ${RABBITMQ_URL}
      BOOKING_SERVICE_URL: http://booking-service:4101
      ORCHESTRATION_SERVICE_URL: http://orchestration-service:4104
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY}
      FLW_SECRET_HASH: ${FLW_SECRET_HASH}
      SERVICE_NAME: payment-service
    networks:
      - app-tier
    depends_on:
      pgbouncer:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4102/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  ledger-service:
    build:
      context: ..
      dockerfile: ledger-service/Dockerfile
    container_name: ledger-service
    env_file:
      - ./.env.production
    environment:
      PORT: "4103"
      DATABASE_URL: postgres://booking_app:${APP_DB_PASSWORD}@pgbouncer:6432/booking_platform
      RABBITMQ_URL: ${RABBITMQ_URL}
      SERVICE_NAME: ledger-service
    networks:
      - app-tier
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4103/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  orchestration-service:
    build:
      context: ..
      dockerfile: orchestration-service/Dockerfile
    container_name: orchestration-service
    env_file:
      - ./.env.production
    environment:
      PORT: "4104"
      DATABASE_URL: postgres://booking_app:${APP_DB_PASSWORD}@pgbouncer:6432/booking_platform
      BOOKING_SERVICE_URL: http://booking-service:4101
      PAYMENT_SERVICE_URL: http://payment-service:4102
      LEDGER_SERVICE_URL: http://ledger-service:4103
      SAGA_PAUSE_TIMEOUT_MS: "1800000"
      SAGA_SWEEP_INTERVAL_MS: "30000"
      SERVICE_NAME: orchestration-service
    networks:
      - app-tier
    depends_on:
      pgbouncer:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4104/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    networks:
      - app-tier
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq_data:
  postgres_data:
  # es-data:
  redis-insight-data:
  postgres_replica_data:


  