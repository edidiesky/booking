apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram-ops
    group_by: ['alertname', 'tier']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: telegram-ops
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h