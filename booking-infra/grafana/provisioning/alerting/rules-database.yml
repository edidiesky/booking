# Database + PgBouncer alert rules (Grafana file provisioning)
# Datasource uid 'prometheus' must match ds.yaml in docker-compose.monitoring.yml
apiVersion: 1
groups:
- orgId: 1
  name: database
  folder: booking
  interval: 1m
  rules:
  - uid: db-pg-down
    title: Postgres down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: pg_up
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: Alerting
    execErrState: Error
    for: 1m
    annotations:
      summary: Postgres is down (pg_up = 0)
      description: postgres-exporter cannot query Postgres. Check `docker logs postgres` and `docker logs postgres-exporter`.
    labels:
      severity: critical
      tier: database
  - uid: db-exporter-down
    title: Postgres exporter not scraped
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: up{job="postgres"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: Alerting
    execErrState: Error
    for: 2m
    annotations:
      summary: Prometheus cannot scrape postgres-exporter
      description: The exporter container is down or unreachable, so every database alert is blind until this is fixed.
    labels:
      severity: critical
      tier: database
  - uid: db-conn-warn
    title: Postgres connections above 80%
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pg_connections_total) / max(pg_connections_max_connections)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.8
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Postgres connections at {{ $values.B.Value | humanizePercentage }} of max_connections
      description: PgBouncer should cap server connections well below max_connections. A high value suggests clients bypass the pooler or pooling is misconfigured.
    labels:
      severity: warning
      tier: database
  - uid: db-conn-crit
    title: Postgres connections above 90%
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pg_connections_total) / max(pg_connections_max_connections)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.9
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: Postgres is close to exhausting max_connections
      description: New connections will start failing with 'too many clients'. Find the biggest consumers with pg_stat_activity.
    labels:
      severity: critical
      tier: database
  - uid: db-idle-in-txn
    title: Idle in transaction too long
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: pg_idle_in_transaction_max_age_seconds
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 60
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: A session has been idle in transaction for over 60s
      description: These sessions hold snapshots, block autovacuum and can hold locks. Usually an app path that opens a transaction and awaits something slow.
    labels:
      severity: warning
      tier: database
  - uid: db-lock-waits
    title: Sessions waiting on locks
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: pg_blocking_sessions_waiting_count
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: Sessions have been waiting on locks for 2+ minutes
      description: 'Find the blocker: SELECT * FROM pg_stat_activity WHERE wait_event_type = ''Lock'';'
    labels:
      severity: warning
      tier: database
  - uid: db-deadlocks
    title: Deadlocks detected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: increase(pg_deadlocks_deadlocks{datname="booking_platform"}[5m])
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: Deadlocks detected in booking_platform
      description: Common under heavy booking contention. Check the Postgres log for the two statements involved and the lock ordering in the code.
    labels:
      severity: warning
      tier: database
  - uid: db-dead-tuples
    title: Dead tuples high (autovacuum behind)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pg_dead_tuples_dead_pct and on(schemaname, table_name) (pg_dead_tuples_n_dead_tup > 1000))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 20
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: A table has over 20% dead tuples
      description: Autovacuum is falling behind. Look for idle-in-transaction sessions and long transactions holding back the xmin horizon.
    labels:
      severity: warning
      tier: database
  - uid: db-autovacuum-stale
    title: Autovacuum stale on a busy table
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pg_dead_tuples_seconds_since_autovacuum and on(schemaname, table_name) (pg_dead_tuples_n_dead_tup > 1000))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 86400
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: A table with many dead tuples has not been autovacuumed in 24h
      description: Check pg_stat_user_tables.last_autovacuum and the autovacuum settings for the table.
    labels:
      severity: warning
      tier: database
  - uid: db-cache-hit
    title: Buffer cache hit ratio below 95%
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum(rate(pg_cache_hit_blks_hit{datname="booking_platform"}[10m])) / (sum(rate(pg_cache_hit_blks_hit{datname="booking_platform"}[10m])) + sum(rate(pg_cache_hit_blks_read{datname="booking_platform"}[10m])))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 0.95
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: Cache hit ratio is below 95%
      description: The working set no longer fits in shared_buffers/OS cache. Note the Postgres container has a 512M memory limit.
    labels:
      severity: warning
      tier: database
  - uid: db-repl-disconnected
    title: Replica disconnected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: absent(pg_replication_lag_lag_bytes)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 3m
    annotations:
      summary: No replica is connected to the primary
      description: pg_stat_replication returned no rows. Check `docker logs postgres-replica`. This also fires if queries.yaml is not loaded.
    labels:
      severity: critical
      tier: database
  - uid: db-repl-lag-time
    title: Replica replay lag above 30s
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pg_replication_lag_replay_lag_seconds)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 30
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Replica is more than 30s behind
      description: Reads from the replica may be stale. Check replica load and network.
    labels:
      severity: warning
      tier: database
  - uid: db-repl-lag-bytes
    title: Replica more than 100MB behind
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pg_replication_lag_lag_bytes)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 104857600
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Replica is over 100MB of WAL behind
      description: wal_keep_size is 512MB. If lag approaches that, the replica can fall off the primary and need a new base backup.
    labels:
      severity: warning
      tier: database
- orgId: 1
  name: pgbouncer
  folder: booking
  interval: 1m
  rules:
  - uid: pgb-down
    title: PgBouncer exporter cannot reach PgBouncer
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: pgbouncer_up
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: Alerting
    execErrState: Error
    for: 2m
    annotations:
      summary: PgBouncer exporter reports pgbouncer_up = 0
      description: The app connects through PgBouncer, so this is user-facing. If it was never 1, check admin_users/stats_users in pgbouncer.ini.
    labels:
      severity: critical
      tier: pooler
  - uid: pgb-clients-waiting
    title: PgBouncer clients waiting
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum(pgbouncer_pools_client_waiting_connections)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: Clients are queueing for a server connection
      description: default_pool_size is 25. Queued clients mean slow queries or too few pooled connections. query_wait_timeout is 20s, after which clients get errors.
    labels:
      severity: warning
      tier: pooler
  - uid: pgb-max-wait
    title: PgBouncer longest wait above 5s
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(pgbouncer_pools_client_maxwait_seconds)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 5
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: A client has waited over 5s for a connection
      description: Queries are about to hit query_wait_timeout (20s).
    labels:
      severity: critical
      tier: pooler