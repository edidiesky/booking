
pg_dead_tuples:
  query: |
    SELECT
      schemaname,
      relname AS table_name,
      n_live_tup,
      n_dead_tup,
      CASE WHEN n_live_tup > 0
        THEN round(n_dead_tup::numeric / n_live_tup * 100, 2)
        ELSE 0
      END AS dead_pct,
      COALESCE(EXTRACT(EPOCH FROM (now() - last_autovacuum)), 0)
        AS seconds_since_autovacuum
    FROM pg_stat_user_tables
    ORDER BY n_dead_tup DESC
    LIMIT 20
  metrics:
    - schemaname:
        usage: LABEL
        description: Schema name
    - table_name:
        usage: LABEL
        description: Table name
    - n_live_tup:
        usage: GAUGE
        description: Live tuple count
    - n_dead_tup:
        usage: GAUGE
        description: Dead tuple count (high means VACUUM is falling behind)
    - dead_pct:
        usage: GAUGE
        description: Dead tuples as percentage of live
    - seconds_since_autovacuum:
        usage: GAUGE
        description: Seconds since last autovacuum (0 if never vacuumed)

# Lock monitoring
pg_lock_waits:
  query: |
    SELECT locktype, mode, granted, count(*) AS lock_count
    FROM pg_locks
    GROUP BY locktype, mode, granted
  metrics:
    - locktype:
        usage: LABEL
        description: Lock type
    - mode:
        usage: LABEL
        description: Lock mode
    - granted:
        usage: LABEL
        description: Whether the lock is granted or waiting
    - lock_count:
        usage: GAUGE
        description: Number of locks (granted=false means active waits)

# Sessions currently waiting on a lock (renamed from blocking_count)
pg_blocking_sessions:
  query: |
    SELECT count(*) AS waiting_count
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
      AND state = 'active'
  metrics:
    - waiting_count:
        usage: GAUGE
        description: Sessions waiting for a lock

# Idle in transaction (autovacuum starvation source)
pg_idle_in_transaction:
  query: |
    SELECT
      count(*) AS session_count,
      COALESCE(EXTRACT(EPOCH FROM max(now() - xact_start)), 0) AS max_age_seconds
    FROM pg_stat_activity
    WHERE state = 'idle in transaction'
  metrics:
    - session_count:
        usage: GAUGE
        description: Sessions idle in transaction
    - max_age_seconds:
        usage: GAUGE
        description: Age of the oldest idle-in-transaction session

# Connection utilisation (client backends only)
pg_connections:
  query: |
    SELECT
      count(*) AS total,
      count(*) FILTER (WHERE state = 'active') AS active,
      count(*) FILTER (WHERE state = 'idle') AS idle,
      count(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_txn,
      (SELECT setting::int FROM pg_settings WHERE name = 'max_connections') AS max_connections
    FROM pg_stat_activity
    WHERE backend_type = 'client backend'
  metrics:
    - total:
        usage: GAUGE
        description: Total client connections
    - active:
        usage: GAUGE
        description: Connections executing queries
    - idle:
        usage: GAUGE
        description: Idle connections
    - idle_in_txn:
        usage: GAUGE
        description: Connections idle inside a transaction
    - max_connections:
        usage: GAUGE
        description: PostgreSQL max_connections setting

# Deadlocks and rollbacks (counters: use rate()/increase() in PromQL)
pg_deadlocks:
  query: |
    SELECT datname, deadlocks, conflicts, xact_commit, xact_rollback
    FROM pg_stat_database
    WHERE datname = current_database()
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - deadlocks:
        usage: COUNTER
        description: Total deadlocks detected
    - conflicts:
        usage: COUNTER
        description: Total query conflicts
    - xact_commit:
        usage: COUNTER
        description: Committed transactions
    - xact_rollback:
        usage: COUNTER
        description: Rolled back transactions

# Buffer cache (counters: compute the ratio over a window in PromQL)
pg_cache_hit:
  query: |
    SELECT datname, blks_hit, blks_read
    FROM pg_stat_database
    WHERE datname = current_database()
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - blks_hit:
        usage: COUNTER
        description: Pages served from shared_buffers
    - blks_read:
        usage: COUNTER
        description: Pages read from disk

# Replication lag (returns no rows if no replica is connected)
pg_replication_lag:
  query: |
    SELECT
      client_addr::text AS replica_addr,
      state,
      COALESCE(EXTRACT(EPOCH FROM write_lag), 0)  AS write_lag_seconds,
      COALESCE(EXTRACT(EPOCH FROM flush_lag), 0)  AS flush_lag_seconds,
      COALESCE(EXTRACT(EPOCH FROM replay_lag), 0) AS replay_lag_seconds,
      COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn), 0) AS lag_bytes
    FROM pg_stat_replication
  metrics:
    - replica_addr:
        usage: LABEL
        description: Replica IP address
    - state:
        usage: LABEL
        description: Replication state
    - write_lag_seconds:
        usage: GAUGE
        description: WAL write lag in seconds
    - flush_lag_seconds:
        usage: GAUGE
        description: WAL flush lag in seconds
    - replay_lag_seconds:
        usage: GAUGE
        description: WAL replay lag in seconds
    - lag_bytes:
        usage: GAUGE
        description: Replication lag in bytes