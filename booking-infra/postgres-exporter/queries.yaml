#  Dead tuple accumulation (autovacuum health) 
pg_dead_tuples:
  query: |
    SELECT
      schemaname,
      relname AS table_name,
      n_live_tup,
      n_dead_tup,
      CASE WHEN n_live_tup > 0
        THEN round(n_dead_tup::numeric / n_live_tup * 100, 2)
        ELSE 0
      END AS dead_pct,
      EXTRACT(EPOCH FROM (now() - last_autovacuum))
        AS seconds_since_autovacuum
    FROM pg_stat_user_tables
    ORDER BY n_dead_tup DESC
  metrics:
    - schemaname:
        usage: LABEL
        description: Schema name
    - table_name:
        usage: LABEL
        description: Table name
    - n_live_tup:
        usage: GAUGE
        description: Live tuple count
    - n_dead_tup:
        usage: GAUGE
        description: Dead tuple count — high value means VACUUM falling behind
    - dead_pct:
        usage: GAUGE
        description: Dead tuples as percentage of live — alert above 20%
    - seconds_since_autovacuum:
        usage: GAUGE
        description: Seconds since last autovacuum — alert if stale

#  Lock monitoring 
pg_lock_waits:
  query: |
    SELECT
      locktype,
      mode,
      granted,
      count(*) AS lock_count
    FROM pg_locks
    GROUP BY locktype, mode, granted
    ORDER BY lock_count DESC
  metrics:
    - locktype:
        usage: LABEL
        description: Lock type (relation, tuple, transactionid, advisory)
    - mode:
        usage: LABEL
        description: Lock mode
    - granted:
        usage: LABEL
        description: Whether lock is granted or waiting
    - lock_count:
        usage: GAUGE
        description: Number of locks — granted=false means active waits

#  Blocking sessions 
pg_blocking_sessions:
  query: |
    SELECT count(*) AS blocking_count
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock'
      AND state = 'active'
  metrics:
    - blocking_count:
        usage: GAUGE
        description: Number of sessions waiting for a lock — alert above 0

#  Idle in transaction (autovacuum starvation source) 
pg_idle_in_transaction:
  query: |
    SELECT
      count(*) AS session_count,
      COALESCE(
        EXTRACT(EPOCH FROM max(now() - xact_start)), 0
      ) AS max_age_seconds
    FROM pg_stat_activity
    WHERE state = 'idle in transaction'
  metrics:
    - session_count:
        usage: GAUGE
        description: Sessions idle in transaction — these hold snapshots and block autovacuum
    - max_age_seconds:
        usage: GAUGE
        description: Age of oldest idle-in-transaction session — alert above 60s

#  Connection pool utilization 
pg_connections:
  query: |
    SELECT
      count(*) AS total,
      count(*) FILTER (WHERE state = 'active') AS active,
      count(*) FILTER (WHERE state = 'idle') AS idle,
      count(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_txn,
      max_conn.setting::int AS max_connections
    FROM pg_stat_activity
    CROSS JOIN (SELECT setting FROM pg_settings WHERE name = 'max_connections') max_conn
    GROUP BY max_conn.setting
  metrics:
    - total:
        usage: GAUGE
        description: Total connections
    - active:
        usage: GAUGE
        description: Active connections executing queries
    - idle:
        usage: GAUGE
        description: Idle connections waiting for client
    - idle_in_txn:
        usage: GAUGE
        description: Connections idle inside a transaction
    - max_connections:
        usage: GAUGE
        description: PostgreSQL max_connections setting

#  Deadlock counter 
pg_deadlocks:
  query: |
    SELECT
      datname,
      deadlocks,
      conflicts,
      xact_commit,
      xact_rollback,
      CASE WHEN xact_commit + xact_rollback > 0
        THEN round(xact_rollback::numeric / (xact_commit + xact_rollback) * 100, 2)
        ELSE 0
      END AS rollback_pct
    FROM pg_stat_database
    WHERE datname = current_database()
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - deadlocks:
        usage: COUNTER
        description: Total deadlocks detected — alert on rate increase
    - conflicts:
        usage: COUNTER
        description: Total query conflicts
    - xact_commit:
        usage: COUNTER
        description: Committed transactions
    - xact_rollback:
        usage: COUNTER
        description: Rolled back transactions
    - rollback_pct:
        usage: GAUGE
        description: Rollback percentage — high value under OCC means high contention

#  Buffer pool hit ratio 
pg_cache_hit:
  query: |
    SELECT
      datname,
      blks_hit,
      blks_read,
      CASE WHEN blks_hit + blks_read > 0
        THEN round(blks_hit::numeric / (blks_hit + blks_read) * 100, 2)
        ELSE 100
      END AS cache_hit_pct
    FROM pg_stat_database
    WHERE datname = current_database()
  metrics:
    - datname:
        usage: LABEL
        description: Database name
    - blks_hit:
        usage: COUNTER
        description: Pages served from shared_buffers
    - blks_read:
        usage: COUNTER
        description: Pages read from disk
    - cache_hit_pct:
        usage: GAUGE
        description: Buffer pool hit ratio — alert below 95%

#  Replication lag 
pg_replication_lag:
  query: |
    SELECT
      client_addr::text AS replica_addr,
      state,
      EXTRACT(EPOCH FROM write_lag)  AS write_lag_seconds,
      EXTRACT(EPOCH FROM flush_lag)  AS flush_lag_seconds,
      EXTRACT(EPOCH FROM replay_lag) AS replay_lag_seconds,
      pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) AS lag_bytes
    FROM pg_stat_replication
  metrics:
    - replica_addr:
        usage: LABEL
        description: Replica IP address
    - state:
        usage: LABEL
        description: Replication state
    - write_lag_seconds:
        usage: GAUGE
        description: WAL write lag in seconds
    - flush_lag_seconds:
        usage: GAUGE
        description: WAL flush lag in seconds
    - replay_lag_seconds:
        usage: GAUGE
        description: WAL replay lag in seconds — alert above 30s
    - lag_bytes:
        usage: GAUGE
        description: Replication lag in bytes — alert above 100MB