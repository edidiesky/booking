
networks:
  app-tier:
    driver: bridge
services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    networks:
      - app-tier
    environment:
      DATA_SOURCE_NAME: "postgresql://pganalyze:RpFkJ3ftppvXNkdy@postgres:5432/booking_platform?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  #  PgBouncer exporter 
  pgbouncer-exporter:
    image: spreaker/prometheus-pgbouncer-exporter:latest
    container_name: pgbouncer-exporter
    networks:
      - app-tier
    environment:
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 6432
      PGBOUNCER_USER: postgres
      PGBOUNCER_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:9127:9127"
    depends_on:
      - pgbouncer
    restart: unless-stopped

  #  PGAnalyze collector 
  # Sidecar that ships pg_stat_statements, locks, vacuum stats to PGAnalyze cloud
  # Replace PGA_API_KEY with your key from app.pganalyze.com
  pganalyze-collector:
    image: quay.io/pganalyze/collector:stable
    container_name: pganalyze-collector
    networks:
      - app-tier
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: booking_platform
      DB_USERNAME: pganalyze
      DB_PASSWORD: RpFkJ3ftppvXNkdy
      PGA_API_KEY: ${PGA_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  #  Prometheus 
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - app-tier
    restart: unless-stopped

  #  Loki 
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./etc/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    networks:
      - app-tier
    restart: unless-stopped

  #  Promtail 
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - app-tier
    volumes:
      - ./etc/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  #  Grafana 
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - ./.env.production
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          orgId: 1
          url: http://prometheus:9090
          isDefault: false
          version: 1
          editable: false
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    networks:
      - app-tier
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
  loki_data: