[databases]
booking_platform = host=postgres port=5432 dbname=booking_platform

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction

auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
auth_user = pgbouncer
auth_query = SELECT username, password FROM public.pgbouncer_lookup($1)

admin_users = pgbouncer
stats_users = pgbouncer

max_client_conn = 500
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 20

log_connections = 1
log_disconnections = 1