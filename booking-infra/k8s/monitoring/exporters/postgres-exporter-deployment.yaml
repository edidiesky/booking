apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: booking-platform
data:
  queries.yaml: |
    pg_database:
      query: "SELECT datname as database_name, pg_database_size(datname) as size_bytes FROM pg_database"
      metrics:
        - database_name:
            usage: "LABEL"
        - size_bytes:
            usage: "GAUGE"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: booking-platform
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_SOURCE_NAME
              value: postgresql://booking:booking-pass@postgres:5432/booking?sslmode=disable
          ports:
            - containerPort: 9187
          volumeMounts:
            - name: postgres-exporter-config
              mountPath: /etc/postgres-exporter/queries.yaml
              subPath: queries.yaml
          resources:
            requests:
              cpu: 80m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: postgres-exporter-config
          configMap:
            name: postgres-exporter-config
