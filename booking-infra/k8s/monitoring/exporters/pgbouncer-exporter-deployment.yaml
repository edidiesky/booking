apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-exporter
  namespace: booking-platform
spec:
  selector:
    app: pgbouncer-exporter
  ports:
    - port: 9127
      targetPort: 9127
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-exporter
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer-exporter
  template:
    metadata:
      labels:
        app: pgbouncer-exporter
    spec:
      containers:
        - name: pgbouncer-exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PGB_EXPORTER_CONNECTION_STRING
              value: postgres://booking:booking-pass@pgbouncer:6432/booking?sslmode=disable
          ports:
            - containerPort: 9127
          resources:
            requests:
              cpu: 80m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
