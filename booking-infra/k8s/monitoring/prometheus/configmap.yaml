apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: booking-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'booking'
        static_configs:
          - targets: ['booking:3000']
      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres-exporter:9187']
      - job_name: 'pgbouncer-exporter'
        static_configs:
          - targets: ['pgbouncer-exporter:9127']
