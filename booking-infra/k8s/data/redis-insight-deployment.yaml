apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: booking-platform
spec:
  selector:
    app: redis-insight
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
        - name: redis-insight
          image: redislabs/redisinsight:2.50
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: REDISINSIGHT_HOST
              value: 0.0.0.0
          resources:
            requests:
              cpu: 80m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
