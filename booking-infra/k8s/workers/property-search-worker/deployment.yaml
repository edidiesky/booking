apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-search-worker
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property-search-worker
  template:
    metadata:
      labels:
        app: property-search-worker
    spec:
      containers:
        - name: property-search-worker
          image: ghcr.io/sde-w/itachi-property-search-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shared-config
            - secretRef:
                name: shared-secret
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -af node >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 512Mi
