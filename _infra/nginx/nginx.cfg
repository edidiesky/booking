upstream api_gateway {
    least_conn;
    server localhost:8000;
    keepalive 32;
}

# HTTP -> HTTPS redirects
server {
    listen 80;
    listen [::]:80;
    server_name akirs-tms.net www.akirs-tms.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

