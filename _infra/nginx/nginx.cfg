server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name akirs-tms.net www.akirs-tms.net;

    ssl_certificate     /etc/letsencrypt/live/akirs-tms.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akirs-tms.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # Request limits
    client_max_body_size 11m;
    client_body_timeout  30s;
    client_header_timeout 10s;
    keepalive_timeout    65s;

    # Connection and rate limits
    # limit_conn conn_limit 30;
    # limit_req  zone=api_global burst=50 nodelay;
    # limit_req_status 429;

    # Strip client-supplied forwarding headers
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP       "";

    # Block scanner probes
    location ~* \.(env|php|git|sql|bak|conf|ini|sh|py|rb)$ {
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|shell|cgi-bin) {
        return 404;
    }

    # Auth routes get a stricter rate limit
    location ~ ^/auth/api/v1/auth/(login|signup|request-reset|password-reset|verify-otp) {

        proxy_pass              http://api_gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_redirect off;
    }

    # Webhook: POST only, no retries (prevent double-processing)
    location = /payment/api/v1/payment/webhook {
        limit_except POST { deny all; }

        proxy_pass              http://api_gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream off;
        proxy_redirect off;
    }

    # All other routes
    location / {
        proxy_pass              http://api_gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        # Removed http_500 from next_upstream -- prevents payment double-fire
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_redirect off;
    }

    access_log /var/log/nginx/api_access.log security;
    error_log  /var/log/nginx/api_error.log warn;
}

# Grafana -- grafana.akirs-tms.net
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.akirs-tms.net;

    ssl_certificate     /etc/letsencrypt/live/grafana.akirs-tms.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.akirs-tms.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Only your IPs -- edit /etc/nginx/acl/ops_ips.conf
    include /etc/nginx/acl/ops_ips.conf;

    client_max_body_size 5m;

    location / {
        proxy_pass          http://localhost:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_buffering off;
    }

    access_log /var/log/nginx/grafana_access.log security;
    error_log  /var/log/nginx/grafana_error.log warn;
}

# Prometheus -- prometheus.akirs-tms.net
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name prometheus.akirs-tms.net;

    ssl_certificate     /etc/letsencrypt/live/prometheus.akirs-tms.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometheus.akirs-tms.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # IP restriction + basic auth = two independent layers
    include /etc/nginx/acl/ops_ips.conf;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd_prometheus;

    location / {
        proxy_pass          http://localhost:9090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    access_log /var/log/nginx/prometheus_access.log security;
    error_log  /var/log/nginx/prometheus_error.log warn;
}

