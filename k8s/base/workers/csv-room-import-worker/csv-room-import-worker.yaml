apiVersion: apps/v1
kind: Deployment
metadata:
  name: csv-room-import-worker
  labels:
    app: csv-room-import-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csv-room-import-worker
  template:
    metadata:
      labels:
        app: csv-room-import-worker
    spec:
      containers:
        - name: csv-room-import-worker
          image: eddyscript/csv-room-import-worker:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}