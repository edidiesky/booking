apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-expiry-worker
  labels:
    app: booking-expiry-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-expiry-worker
  template:
    metadata:
      labels:
        app: booking-expiry-worker
    spec:
      containers:
        - name: booking-expiry-worker
          image: eddyscript/booking-expiry-worker:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}