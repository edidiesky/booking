<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style type="text/css">
      body, table, td, th, p, span, h1, h2, h3, a, div, strong, b {
        font-family: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important;
      }
    </style>
    <!--[if mso]>
    <style type="text/css">
      body, table, td, th, p, span, h1, h2, h3, a, div, strong, b {
        font-family: Arial, Helvetica, sans-serif !important;
      }
    </style>
    <![endif]-->
  </head>
  <body style="margin:0;padding:0;background:#ffffff;font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#4c4c4c;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
      <tr>
        <td align="center">
          <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;">
            
            <!-- Brand -->
            <tr>
              <td style="padding:32px 40px 24px;">
                <span style="font-size:18px;font-weight:700;color:#1a56ff;letter-spacing:-0.3px;">
                  Booking
                </span>
              </td>
            </tr>

            <!-- Main Content -->
            <tr>
              <td style="padding:0 40px 40px;">
                
                <h1 style="margin:0 0 16px;font-size:28px;line-height:36px;color:#0f172a;font-weight:700;letter-spacing:-0.5px;">
                  You're checked in
                </h1>

                <p style="font-size:15px;line-height:24px;margin:0 0 28px;color:#475569;">
                  Hi {{guestName}}, you're checked in at <strong>{{propertyName}}</strong>. Enjoy your stay.
                </p>

                <!-- Details table -->
                <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;margin:0 0 28px;">
                  <tr>
                    <td style="font-size:14px;color:#64748b;padding:14px 16px;border-bottom:1px solid #e2e8f0;">Booking reference</td>
                    <td style="font-size:14px;color:#0f172a;padding:14px 16px;border-bottom:1px solid #e2e8f0;text-align:right;">{{bookingRef}}</td>
                  </tr>
                  <tr>
                    <td style="font-size:14px;color:#64748b;padding:14px 16px;border-bottom:1px solid #e2e8f0;">Check-in</td>
                    <td style="font-size:14px;color:#0f172a;padding:14px 16px;border-bottom:1px solid #e2e8f0;text-align:right;">{{checkIn}}</td>
                  </tr>
                  <tr>
                    <td style="font-size:14px;color:#64748b;padding:14px 16px;">Check-out</td>
                    <td style="font-size:14px;color:#0f172a;padding:14px 16px;text-align:right;">{{checkOut}}</td>
                  </tr>
                </table>

                <a href="{{supportUrl}}" style="color:#1a56ff;font-size:14px;text-decoration:underline;">
                  Need anything during your stay?
                </a>
              </td>
            </tr>
          </table>

          <!-- Footer -->
          <table width="560" cellpadding="0" cellspacing="0">
            <tr>
              <td style="padding:24px 40px 40px;border-top:1px solid #f1f5f9;">
                <p style="margin:0;font-size:12px;color:#94a3b8;">
                  &copy; {{year}} Booking. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
