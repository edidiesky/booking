<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style type="text/css">
      body, table, td, th, p, span, h1, h2, h3, a, div, strong, b {
        font-family: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important;
      }
    </style>
    <!--[if mso]>
    <style type="text/css">
      body, table, td, th, p, span, h1, h2, h3, a, div, strong, b {
        font-family: Arial, Helvetica, sans-serif !important;
      }
    </style>
    <![endif]-->
  </head>
  <body style="margin:0;padding:0;background:#f3f4f6;font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#475569;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f3f4f6;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="560" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;max-width:560px;width:100%;">

            <tr>
              <td align="center" style="padding:48px 48px 0;">
                <span style="font-size:20px;font-weight:700;color:#1a56ff;letter-spacing:-0.4px;line-height:1;">Booking</span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 48px 0;">
                <table width="100%" cellpadding="0" cellspacing="0" role="presentation"><tr>
                  <td style="border-top:1px solid #eef0f3;font-size:0;line-height:0;">&nbsp;</td>
                </tr></table>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:40px 48px 0;">
                <img src="{{iconUrl}}" width="72" height="72" alt="" style="display:block;border:0;outline:none;width:72px;height:72px;" />
              </td>
            </tr>

            <tr>
              <td style="padding:28px 48px 0;">
                <h1 style="margin:0;font-size:32px;line-height:40px;font-weight:700;color:#0f172a;letter-spacing:-0.6px;">Account<br />created</h1>
              </td>
            </tr>

            <tr>
              <td style="padding:28px 48px 0;">
                <table width="100%" cellpadding="0" cellspacing="0" role="presentation"><tr>
                  <td style="border-top:1px solid #eef0f3;font-size:0;line-height:0;">&nbsp;</td>
                </tr></table>
              </td>
            </tr>

            <tr>
              <td style="padding:28px 48px 0;">
                <p style="margin:0;font-size:15px;line-height:26px;color:#64748b;">Hi {{firstName}} {{lastName}}, your account has been created{{#if tenantName}} for <strong style="color:#0f172a;">{{tenantName}}</strong>{{/if}}.</p>
              </td>
            </tr>

            <tr>
              <td style="padding:32px 48px 0;">
                <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                  <tr>
                    <td style="padding:0 0 18px;font-size:12px;line-height:16px;font-weight:600;color:#94a3b8;letter-spacing:0.6px;text-transform:uppercase;">Account type</td>
                    <td align="right" style="padding:0 0 18px;font-size:15px;line-height:20px;font-weight:600;color:#0f172a;">{{userType}}</td>
                  </tr>
                  <tr>
                    <td colspan="2" style="border-top:1px solid #eef0f3;font-size:0;line-height:0;padding:0;">&nbsp;</td>
                  </tr>
                  <tr>
                    <td style="padding:18px 0 0;font-size:12px;line-height:16px;font-weight:600;color:#94a3b8;letter-spacing:0.6px;text-transform:uppercase;">Name</td>
                    <td align="right" style="padding:18px 0 0;font-size:15px;line-height:20px;font-weight:600;color:#0f172a;">{{firstName}} {{lastName}}</td>
                  </tr>

                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:40px 48px 0;">
                <a href="{{loginUrl}}" style="background:#1a56ff;color:#ffffff;padding:14px 36px;font-weight:600;font-size:15px;line-height:20px;text-decoration:none;display:inline-block;border-radius:100px;">Sign in</a>
              </td>
            </tr>

            <tr>
              <td style="padding:14px 48px 0;">
                <a href="{{supportUrl}}" style="color:#1a56ff;font-size:14px;line-height:20px;font-weight:500;text-decoration:underline;">Need help?</a>
              </td>
            </tr>

            <tr>
              <td style="padding:36px 48px 48px;">
                <p style="margin:0;font-size:13px;line-height:22px;color:#94a3b8;">Welcome to the Bukking Platform.</p>
              </td>
            </tr>

          </table>
          <table width="560" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;width:100%;">
            <tr>
              <td align="center" style="padding:28px 16px 8px;">
                <p style="margin:0;font-size:12px;line-height:18px;color:#94a3b8;">&copy; {{year}} Booking. All rights reserved.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
