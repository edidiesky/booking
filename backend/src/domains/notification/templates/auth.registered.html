<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#f7f7f8;font-family:'Bricolage Grotesque',Georgia,serif;color:#4c4c4c">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr><td height="48"></td></tr>
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border:2px solid #f0f0f0;border-radius:20px">
        <tr><td style="padding:40px 48px 8px"><span style="font-size:18px;font-weight:700;color:#17191c">Booking</span></td></tr>
        <tr><td style="padding:24px 48px 48px">
          <h1 style="margin:0 0 16px;font-size:28px;line-height:1.3;color:#17191c;font-weight:600">Account created</h1>
          <p style="font-size:15px;line-height:26px;margin:0 0 16px">Hi {{firstName}} {{lastName}}, your account has been created{{#if tenantName}} for <strong>{{tenantName}}</strong>{{/if}}.</p>
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f8;border-radius:8px;margin:0 0 32px;text-align:left;overflow:hidden">
            <tr>
              <td style="font-size:15px;color:#777b86;padding:12px 16px;border-bottom:1px solid #f0f0f0">Account type</td>
              <td style="font-size:15px;color:#17191c;padding:12px 16px;border-bottom:1px solid #f0f0f0;text-align:right">{{userType}}</td>
            </tr>
            <tr>
              <td style="font-size:15px;color:#777b86;padding:12px 16px">Name</td>
              <td style="font-size:15px;color:#17191c;padding:12px 16px;text-align:right">{{firstName}} {{lastName}}</td>
            </tr>
          </table>
          <a href="{{loginUrl}}" style="background:#5d2a1a;color:#ffffff;padding:16px 40px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;display:inline-block">Sign in</a>
          <div style="margin-top:20px"><a href="{{supportUrl}}" style="color:#5d2a1a;font-size:15px;text-decoration:underline">Need help?</a></div>
          <p style="font-size:13px;color:#a3a6af;margin:32px 0 0;line-height:20px">Welcome to the Booking Platform.</p>
        </td></tr>
      </table>
      <table width="560" cellpadding="0" cellspacing="0">
        <tr><td height="28"></td></tr>
        <tr><td align="center">
          <p style="margin:0;font-size:12px;letter-spacing:1.5px;color:#a3a6af;font-weight:600">BOOKING</p>
          <p style="margin:6px 0 0;font-size:12px;color:#a3a6af">Stays &middot; Support &middot; Help Center</p>
        </td></tr>
      </table>
    </td></tr>
    <tr><td height="48"></td></tr>
  </table>
</body>
</html>
